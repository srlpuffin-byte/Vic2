<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:wght@600&amp;display=swap');
      .fav-vic {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 38px;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #2c2725;
      }
      .fav-tis {
        font-family: 'Alex Brush', cursive;
        font-size: 30px;
        fill: #c98a92;
      }
    </style>
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5ede5"/>
    </radialGradient>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#fav-bg)" stroke="#e8ded4" stroke-width="2"/>
  
  <text x="38" y="58" text-anchor="middle" class="fav-vic">VIC</text>
  <text x="62" y="65" text-anchor="middle" class="fav-tis" transform="rotate(-5, 62, 65)">T</text>
</svg>
