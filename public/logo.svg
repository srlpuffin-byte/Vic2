<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@500&amp;display=swap');
      .vic-title {
        font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
        font-size: 42px;
        font-weight: 500;
        letter-spacing: 0.16em;
        fill: #2c2725;
      }
      .tissera-script {
        font-family: 'Alex Brush', 'Great Vibes', cursive;
        font-size: 34px;
        font-weight: 400;
        fill: #c98a92;
      }
      .sub-integral {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 7.5px;
        font-weight: 500;
        letter-spacing: 0.32em;
        fill: #4a423f;
      }
      .sub-line {
        stroke: #8a807d;
        stroke-width: 0.8;
        stroke-linecap: round;
        opacity: 0.7;
      }
    </style>
  </defs>

  <!-- Serif Main: VIC -->
  <text x="114" y="38" text-anchor="middle" class="vic-title">VIC</text>
  
  <!-- Cursive Script: Tissera (overlayed diagonally across the lower part of VIC) -->
  <text x="126" y="44" text-anchor="middle" class="tissera-script" transform="rotate(-3, 126, 44)">Tissera</text>
  
  <!-- Subtitle: - ESTÉTICA INTEGRAL - -->
  <g transform="translate(0, 18)">
    <line x1="28" y1="41" x2="48" y2="41" class="sub-line" />
    <text x="120" y="44" text-anchor="middle" class="sub-integral">ESTÉTICA INTEGRAL</text>
    <line x1="192" y1="41" x2="212" y2="41" class="sub-line" />
  </g>
</svg>
